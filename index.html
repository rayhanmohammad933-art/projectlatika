<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pola Hidup Sehat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Pola Hidup Sehat</h1>
        
        <!-- Halaman Awal: Profil -->
        <div id="profile-section">
            <h2>Lengkapi Profil Anda</h2>
            <form id="profile-form">
                <input type="text" id="name" placeholder="Nama" required>
                <input type="number" id="age" placeholder="Umur" required>
                <select id="gender">
                    <option value="">Pilih Jenis Kelamin</option>
                    <option value="Laki-laki">Laki-laki</option>
                    <option value="Perempuan">Perempuan</option>
                </select>
                <input type="number" id="height" placeholder="Tinggi Badan (cm)" step="0.1">
                <input type="number" id="weight" placeholder="Berat Badan (kg)" step="0.1">
                <button type="submit">Simpan Profil</button>
            </form>
        </div>
        
        <!-- Dashboard -->
        <div id="dashboard" class="hidden">
            <h2>Halo, <span id="user-name"></span>! Pilih Kategori Cek Kesehatan</h2>
            <button onclick="showChecker('bmi')">Cek BMI</button>
            <button onclick="showChecker('diet')">Cek Pola Makan</button>
            <button onclick="showChecker('sleep')">Cek Pola Tidur</button>
            <button onclick="logout()">Logout</button>
        </div>
        
        <!-- Halaman Cek -->
        <div id="checker-section" class="hidden">
            <h2 id="checker-title"></h2>
            <form id="checker-form">
                <!-- Form akan diisi dinamis oleh JS -->
                <button type="submit">Cek Sekarang</button>
            </form>
        </div>
        
        <!-- Hasil -->
        <div id="result-section" class="hidden">
            <h2>Hasil</h2>
            <div id="result-content"></div>
            <button onclick="downloadResult()">Unduh Hasil</button>
            <div class="social-share">
                <a href="#" id="share-twitter">Bagikan ke Twitter</a>
                <a href="#" id="share-facebook">Bagikan ke Facebook</a>
            </div>
            <button onclick="backToDashboard()">Kembali ke Dashboard</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
